id: wordpress-user-enumeration-comments

info:
  name: WordPress User Enumeration via Comments
  description: Enumerates WordPress users from HTML comments and author metadata
  severity: medium
  tags:
    - wordpress
    - user-enumeration
    - comments
    - reconnaissance
    - aggressive

requests:
  - method: GET
    path:
      - "/"
      - "/index.php"
    
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "author"
          - "by"
      - type: regex
        regex:
          - "by\\s+([a-zA-Z0-9_-]+)"
    
    extractors:
      - type: regex
        name: author_from_html
        regex:
          - "by\\s+<a[^>]*href=['\"]([^'\"]*author=([^'\"&]+))"
      - type: regex
        name: author_names
        regex:
          - "(?:Posted|Written)\\s+by\\s+([a-zA-Z0-9_\\s]+)[<\\n]"
