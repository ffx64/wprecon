id: wordpress-js-version-fingerprint

info:
  name: WordPress Version via JS/CSS Fingerprinting
  author: wprecon
  severity: info
  description: |
    WordPress version can be extracted from the version query parameters appended
    to bundled JS and CSS files (e.g. ?ver=6.4.2). This is a passive fingerprinting
    technique that works even when the meta generator tag is removed.
  tags:
    - wordpress
    - version
    - fingerprint
    - reconnaissance

requests:
  - method: GET
    path:
      - /
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - wp-includes
          - wp-content
        condition: or
    extractors:
      - type: regex
        name: wp_version
        regex:
          - "wp-includes/[^?]+\\?ver=([0-9]+\\.[0-9]+\\.?[0-9]*)"
      - type: regex
        name: jquery_version
        regex:
          - "jquery\\.min\\.js\\?ver=([0-9]+\\.[0-9]+\\.?[0-9]*)"
      - type: regex
        name: theme_slug
        regex:
          - "wp-content/themes/([a-zA-Z0-9_-]+)/"
      - type: regex
        name: plugin_slugs
        regex:
          - "wp-content/plugins/([a-zA-Z0-9_-]+)/"
