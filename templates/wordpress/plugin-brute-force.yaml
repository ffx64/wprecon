id: wordpress-plugin-brute-force

info:
  name: WordPress Plugin Brute Force Detection
  description: Attempts to brute force common WordPress plugins via common paths
  severity: medium
  tags:
    - wordpress
    - brute-force
    - plugins
    - reconnaissance
    - aggressive

requests:
  - method: GET
    path:
      - "/wp-content/plugins/akismet/"
      - "/wp-content/plugins/jetpack/"
      - "/wp-content/plugins/yoast-seo/"
      - "/wp-content/plugins/contact-form-7/"
      - "/wp-content/plugins/wordfence/"
      - "/wp-content/plugins/woocommerce/"
      - "/wp-content/plugins/elementor/"
      - "/wp-content/plugins/wordpress-seo/"
      - "/wp-content/plugins/google-analytics-for-wordpress/"
      - "/wp-content/plugins/all-in-one-seo-pack/"
      - "/wp-content/plugins/wp-super-cache/"
      - "/wp-content/plugins/duplicate-post/"
      - "/wp-content/plugins/limit-login-attempts/"
      - "/wp-content/plugins/tinymce-advanced/"
      - "/wp-content/plugins/advanced-custom-fields/"
    
    matchers:
      - type: status
        status:
          - 200
          - 403
    
    extractors:
      - type: regex
        name: plugin_found
        regex:
          - "(/wp-content/plugins/[^/]+/)"
