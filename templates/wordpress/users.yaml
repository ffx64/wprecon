id: wordpress-users-api

info:
  name: WordPress Users REST API
  author: ffx64
  description: Enumerates WordPress users via REST API
  severity: low
  tags:
    - wordpress
    - enumeration
    - users

requests:
  - method: GET
    path:
      - "/wp-json/wp/v2/users"
    
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "username"
          - "id"
    
    extractors:
      - type: regex
        name: username
        regex:
          - '"slug":"([a-z0-9\\-\\_]+)"'
      - type: regex
        name: user_id
        regex:
          - '"id":([0-9]+)'
